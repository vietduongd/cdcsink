# ---- Sink: NATS JetStream (stream CDC do nats-init tạo sẵn) ----
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
debezium.sink.nats-jetstream.create-stream=false

# ---- Source: Postgres ----
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=pg-source
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=source_db
# Subject NATS = <topic.prefix>.<schema>.<table>, vd debezium.public.orders -> khớp TOPIC_NAME=debezium.>
debezium.source.topic.prefix=debezium
debezium.source.schema.include.list=public
debezium.source.slot.name=cdcsink_e2e
debezium.source.publication.name=cdcsink_e2e
debezium.source.publication.autocreate.mode=all_tables
debezium.source.snapshot.mode=initial
# cdcsink parse mọi message thành JSON -> không được gửi tombstone (payload rỗng)
debezium.source.tombstones.on.delete=false
# numeric(p,s) -> org.apache.kafka.connect.data.Decimal (base64 + scale), cdcsink đã hỗ trợ
debezium.source.decimal.handling.mode=precise
# interval dạng chuỗi ISO-8601 (P1DT2H3M4S) để giữ đúng năm/tháng/ngày.
# Mặc định (numeric) Debezium đổi ra microsecond, tháng tính xấp xỉ 30 ngày.
debezium.source.interval.handling.mode=string

debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# ---- Format: JSON kèm schema (cdcsink cần field "schema" để suy kiểu cột) ----
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=true
debezium.format.value.schemas.enable=true

# Log dạng text thay vì JSON cho dễ đọc
quarkus.log.console.json=false
